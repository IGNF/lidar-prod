name: CICD

on:
  # Run CICD for non-draft pull request
  pull_request:
    branches:
      - main
  # Also run when the pull request merges (which generates a push)
  # So that we can tag the docker image appropriately.
  push:
    branches:
      - main
      - staging-*

    tags:
      - "**"

env:
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io
  TEST_TAG: ${{ github.repository }}:test

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: replace BD_UNI credentials
        run: |
          cp configs/bd_uni_connection_params/credentials_template.yaml configs/bd_uni_connection_params/credentials.yaml
          sed -i '/user:/c\user: invite' configs/bd_uni_connection_params/credentials.yaml
          sed -i '/pwd:/c\pwd: ${{ secrets.PASSWORD_BD_UNI }}' configs/bd_uni_connection_params/credentials.yaml

      - name: Setup micromamba environment
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: environment.yml
          environment-name: lidar_prod
          cache-environment: true
          cache-downloads: true
          generate-run-shell: true

      - name: Check code neatness (linter)
        shell: micromamba-shell {0}
        run: python -m flake8

      - name: Run tests & get coverage - fast ones go first.
        shell: micromamba-shell {0}
        run: python -m pytest -rA -vv -m "not slow"

      - name: Run slow tests last (evaluation on a large file)
        shell: micromamba-shell {0}
        run: python -m  pytest -rA -v -m "slow" --no-cov

  test-deploy-docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          lfs: false # Test on large file skipped in docker image

      - name: Build the Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          load: true
          tags: ${{ env.TEST_TAG }}

      - name: Run pytest unit tests in docker image (except slow test on a large file)
        run: >
          docker run
          --ipc=host
          ${{ env.TEST_TAG }}
          python -m
          pytest -rA -v -m "not slow"

      - name: Example using building module from CLI on a LAS subset.
        run: >
          docker run --network host
          -v ${{ github.workspace }}/test_outputs:/app/tmp
          lidar_prod
          python
          lidar_prod/run.py
          +task=apply_on_building
          paths.src_las=/app/tests/files/example_assets_input/Semis_2021_0937_6537_LA93_IGN69.150mx100m.for_full_building_module.laz
          paths.output_dir=/app/tmp/apply_on_building

      - name: Test vegetation/unclassified detection from CLI on a LAS subset.
        run: >
          docker run
          -v ${{ github.workspace }}/test_outputs:/app/tmp
          lidar_prod
          python
          lidar_prod/run.py
          +task=identify_vegetation_unclassified
          data_format=vegetation_unclassified.yaml
          paths.src_las=/app/tests/files/example_assets_input/888000_6614000.subset.laz
          paths.output_dir=/app/tmp/identify_vegetation_unclassified

      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build an Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Create release only if pushing a tag
      - name: Archive test outputs
        if: startsWith(github.ref, 'refs/tags/')
        run: tar -czf test_outputs.tar.gz test_outputs/

      - name: Create Release with functional test outputs as assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: test_outputs.tar.gz
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
